# Azure DevOps Pipeline for QA Automation Agent

trigger:
  branches:
    include:
      - main
      - develop
      - feature/*

pr:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: "ubuntu-latest"

variables:
  NODE_VERSION: "18.x"

stages:
  - stage: Test
    displayName: "Run Automated Tests"
    jobs:
      - job: AutomatedTests
        displayName: "Execute Playwright Tests for Changed Areas"
        steps:
          - task: NodeTool@0
            displayName: "Install Node.js"
            inputs:
              versionSpec: $(NODE_VERSION)

          - script: |
              node --version
              npm --version
            displayName: "Display Node and npm versions"

          - script: |
              npm ci
            displayName: "Install dependencies"

          - script: |
              npx playwright install --with-deps chromium
            displayName: "Install Playwright browsers"

          - script: |
              node src/executeTests.js
            env:
              AZURE_DEVOPS_ORG_URL: $(AZURE_DEVOPS_ORG_URL)
              AZURE_PERSONAL_ACCESS_TOKEN: $(AZURE_PAT)
              AZURE_PROJECT_NAME: $(AZURE_PROJECT_NAME)
              OPENAI_API_KEY: $(OPENAI_KEY)
              BASE_BRANCH: $(System.PullRequest.TargetBranch)
              REPO_PATH: $(Build.SourcesDirectory)
            displayName: "Execute tests for changed areas"
            continueOnError: true

          - task: PublishTestResults@2
            displayName: "Publish test results"
            inputs:
              testResultsFormat: "JUnit"
              testResultsFiles: "**/playwright-report/results.xml"
              failTaskOnFailedTests: true
            condition: always()

          - task: PublishBuildArtifacts@1
            displayName: "Publish HTML report"
            inputs:
              PathtoPublish: "reports"
              ArtifactName: "test-reports"
            condition: always()

          - task: PublishBuildArtifacts@1
            displayName: "Publish Playwright report"
            inputs:
              PathtoPublish: "playwright-report"
              ArtifactName: "playwright-report"
            condition: always()

          - script: |
              if [ -f reports/latest-execution.json ]; then
                cat reports/latest-execution.json
              fi
            displayName: "Display test summary"
            condition: always()

  - stage: Deploy
    displayName: "Deploy Reports"
    dependsOn: Test
    condition: always()
    jobs:
      - job: DeployReports
        displayName: "Deploy Test Reports"
        steps:
          - download: current
            artifact: test-reports

          - script: |
              echo "Reports can be viewed in the pipeline artifacts"
            displayName: "Report deployment info"

name: Playwright

on:
  workflow_dispatch:
    inputs:
      test_tag:
        description: 'Optional tag filter, for example @smoke, @regression, or @TC1001. Leave blank to run all tests.'
        required: false
        type: string
        default: ''
      browser:
        description: 'Browser project to run'
        required: true
        type: choice
        default: chromium
        options:
          - chromium
          - firefox
          - webkit
  # pull_request:
  #   branches:
  #     - main
  # push:
  #   branches:
  #     - main
  # schedule:
  #   - cron: '0 2 * * *'

permissions:
  contents: read

jobs:
  test:
    name: Playwright (${{ github.event_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      BASE_URL: ${{ vars.BASE_URL_QA }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      BROWSER: ${{ github.event.inputs.browser || 'chromium' }}
      TEST_TAG: ${{ github.event.inputs.test_tag || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Validate QA base URL
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "BASE_URL_QA repository variable is required."
            exit 1
          fi

      - name: Install Playwright browser
        run: npx playwright install --with-deps "$BROWSER"

      - name: Resolve test filter
        id: filter
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo 'grep=@smoke' >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            echo 'grep=@regression' >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$TEST_TAG" ]; then
            echo "grep=$TEST_TAG" >> "$GITHUB_OUTPUT"
          else
            echo 'grep=' >> "$GITHUB_OUTPUT"
          fi

      - name: Run Playwright tests
        shell: bash
        run: |
          if [ -n "${{ steps.filter.outputs.grep }}" ]; then
            npx playwright test --grep "${{ steps.filter.outputs.grep }}" --project="$BROWSER"
          else
            npx playwright test --project="$BROWSER"
          fi

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_number }}-${{ github.run_attempt }}
          path: playwright-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results-${{ github.run_number }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

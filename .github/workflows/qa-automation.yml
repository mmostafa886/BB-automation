# GitHub Actions — QA Automation Agent

on:
  workflow_dispatch:
#   push:
#     branches:
#       - main
#       - develop
#       - "feature/**"
#   pull_request:
#     branches:
#       - main
#       - develop

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"
          cache: "npm"

      - name: Display Node and npm versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Execute tests for changed areas
        run: node src/executeTests.ts
        continue-on-error: true
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
          JIRA_TC_ISSUE_TYPE: ${{ secrets.JIRA_TC_ISSUE_TYPE }}
          JIRA_US_ISSUE_TYPE: ${{ secrets.JIRA_US_ISSUE_TYPE }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BASE_BRANCH: ${{ github.base_ref }}
          REPO_PATH: ${{ github.workspace }}

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
          retention-days: 30

      - name: Publish JUnit test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Playwright Tests
          path: "**/playwright-report/results.xml"
          reporter: java-junit
          fail-on-error: false

      - name: Display test summary
        if: always()
        run: |
          if [ -f reports/latest-execution.json ]; then
            cat reports/latest-execution.json
          fi

  deploy-reports:
    name: Deploy Test Reports
    runs-on: ubuntu-latest
    needs: test
    if: always()

    steps:
      - name: Download test-reports artifact
        uses: actions/download-artifact@v4
        with:
          name: test-reports
          path: reports/

      - name: Report deployment info
        run: echo "Reports are available in the Actions run artifacts tab."

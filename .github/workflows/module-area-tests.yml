name: Module Area Tests

on:
  workflow_dispatch:
    inputs:
      module:
        description: 'Module folder under tests/generated to run (e.g. SignUp, Login, Assets, DirectCost, IndirectCost, Revenues) — required, no default'
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Module Area Tests (on-demand)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      BASE_URL: ${{ vars.BASE_URL_QA }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Resolve module
        id: resolve
        shell: bash
        run: |
          if [ -z "${{ github.event.inputs.module }}" ]; then
            echo "The 'module' input is required — re-trigger and provide a module name."
            exit 1
          fi
          echo "module=${{ github.event.inputs.module }}" >> "$GITHUB_OUTPUT"

      - name: Run module area tests
        run: npm run test:area "${{ steps.resolve.outputs.module }}"

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_number }}-${{ github.run_attempt }}
          path: playwright-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results-${{ github.run_number }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

name: Module Area Tests

on:
  workflow_dispatch:
    inputs:
      module:
        description: 'Module folder under tests/generated to run (e.g. SignUp, Login, Assets, DirectCost, IndirectCost, Revenues) — required, no default'
        required: true
        type: string
  # One-time scheduled run: fires at 2026-07-21 13:40 UTC (~20 minutes after this
  # workflow was added) to execute the SignUp module tests. Cron schedules in
  # GitHub Actions are recurring by nature — this entry is pinned to a specific
  # date, so it only matches once. Remove or update this schedule after it runs.
  schedule:
    - cron: '40 13 21 7 *'

permissions:
  contents: read

jobs:
  test:
    name: Module Area Tests (${{ github.event_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      BASE_URL: ${{ vars.BASE_URL_QA }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Validate QA base URL
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "BASE_URL_QA repository variable is required."
            exit 1
          fi

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Resolve module
        id: resolve
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -z "${{ github.event.inputs.module }}" ]; then
              echo "The 'module' input is required for manual runs — re-trigger and provide a module name."
              exit 1
            fi
            echo "module=${{ github.event.inputs.module }}" >> "$GITHUB_OUTPUT"
          else
            echo 'module=SignUp' >> "$GITHUB_OUTPUT"
          fi

      - name: Run module area tests
        run: npm run test:area "${{ steps.resolve.outputs.module }}"

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_number }}-${{ github.run_attempt }}
          path: playwright-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results-${{ github.run_number }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

name: Scheduled Execution

on:
  # Recurring weekly run every Friday at 00:00 UTC.
  # Modules run are listed in the job's MODULES env var below; add a module
  # there (no other workflow changes needed) as it comes online.
  schedule:
    - cron: '0 0 * * 5'
  # Manual trigger so the run doesn't have to wait for the next Friday.
  workflow_dispatch:

permissions:
  contents: write  # required so the "Publish report to GitHub Pages" step can push to gh-pages

jobs:
  test:
    name: Scheduled Execution
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      BASE_URL: ${{ vars.BASE_URL_QA }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      # when this GitHub variable isn't set — same pattern BASE_URL uses with playwright.config.ts.
      API_BASE_URL: ${{ vars.API_BASE_URL_QA }}
      # Comma-separated list of tests/generated module folders to run each week.
      # Add a module here (no other workflow changes needed) as it comes online.
      #
      # Personnel MUST stay LAST in this list. Its spec's test.beforeAll reuses the shared "test"
      # forecast created below and adds a "Sales" revenue stream to it for its own "% of revenue"
      # scenario. That revenue stream stays on the forecast for the rest of this job. Running
      # Personnel last means no other module sees it — placing Personnel earlier would silently
      # change dashboard totals for every module that runs after it. See
      # docs/personnel-revenue-seeding.md.
      MODULES: "SignUp,Revenues,DirectCost,IndirectCost,Assets,Personnel"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Seed forecast
        # Creates one forecast over the API (login -> company id -> POST /api/financial_plans)
        # shared by every module below, via .seed/run-context.json. See src/scripts/seed-forecast.ts.
        run: npm run seed:forecast

      - name: Run module tests
        run: |
          # Each module runs Playwright in a fresh process. The blob reporter
          # wipes its own outputDir at the start of every run, so each module
          # writes to a private scratch dir first — otherwise the next module
          # would delete the previous module's blob report before it's merged.
          IFS=',' read -ra MODULE_LIST <<< "$MODULES"
          FAILED=0
          mkdir -p blob-report
          for module in "${MODULE_LIST[@]}"; do
            echo "::group::Running $module module tests"
            rm -rf blob-report-scratch
            PLAYWRIGHT_REPORTER=blob PLAYWRIGHT_BLOB_OUTPUT_DIR=blob-report-scratch \
              npm run test:area "$module" || FAILED=1
            if [ -d blob-report-scratch ]; then
              cp blob-report-scratch/*.zip "blob-report/${module}.zip"
            fi
            echo "::endgroup::"
          done
          exit $FAILED

      - name: Delete seeded forecast
        if: always()
        run: npm run seed:forecast:delete

      - name: Merge module reports
        if: always()
        run: npx playwright merge-reports --reporter=html,list ./blob-report

      - name: Upload raw blob reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ github.run_number }}-${{ github.run_attempt }}
          path: blob-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_number }}-${{ github.run_attempt }}
          path: playwright-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results-${{ github.run_number }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Publish report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: playwright-report
          destination_dir: reports/${{ github.run_number }}
          keep_files: true

      - name: Write report link to job summary
        if: always()
        run: |
          echo "### Playwright report" >> "$GITHUB_STEP_SUMMARY"
          echo "https://${{ github.repository_owner }}.github.io/$(basename ${{ github.repository }})/reports/${{ github.run_number }}/" >> "$GITHUB_STEP_SUMMARY"

      - name: Slack notification
        if: always()
        # Incoming Webhook (single SLACK_WEBHOOK_URL secret + curl) chosen over the Slack
        # Bot Token/API approach — no app install, OAuth scopes, or channel-ID lookup needed
        # for a plain pass/fail ping.
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            STATUS_EMOJI="✅"
            STATUS_TEXT="Passed"
          else
            STATUS_EMOJI="❌"
            STATUS_TEXT="Failed"
          fi
          REPORT_URL="https://${{ github.repository_owner }}.github.io/$(basename ${{ github.repository }})/reports/${{ github.run_number }}/"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -f -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"${STATUS_EMOJI} *Scheduled Execution* ${STATUS_TEXT} — modules: ${MODULES}\n<${RUN_URL}|View run> | <${REPORT_URL}|View report>\"}" \
            "${{ secrets.SLACK_WEBHOOK_URL }}"
